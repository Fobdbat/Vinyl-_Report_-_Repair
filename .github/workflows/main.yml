name: Build VinylPremaster (Windows 64-bit)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: x64
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build
        run: pyinstaller --noconfirm --clean VinylPremaster.spec
      - uses: actions/upload-artifact@v4
        with:
          name: VinylPremaster-windows-x64
          path: dist/VinylPremaster/
